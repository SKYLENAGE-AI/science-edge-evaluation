    </g>
    <g stroke-linecap="round">
      <path d="M102 119 148 96 195 122 196 171 148 190 103 166Z M148 96 149 65M195 122 230 105M196 171 230 192M103 166 74 188M102 119 73 100" stroke="#90A9CB" stroke-width="7"/>
      <path d="M102 119 148 96 195 122 196 171 148 190 103 166Z M148 96 149 65M195 122 230 105M196 171 230 192M103 166 74 188M102 119 73 100" stroke="#E2EBF8" stroke-width="2"/>
      <path d="M114 123 147 107M185 129V163M144 178 114 162" stroke="#8AA8CC" stroke-width="2"/>
    </g>
    <g fill="url(#atom)" stroke="#8EA9CD" stroke-width=".6">
      <circle cx="102" cy="119" r="10"/><circle cx="148" cy="96" r="11"/><circle cx="195" cy="122" r="10"/><circle cx="196" cy="171" r="11"/><circle cx="148" cy="190" r="10"/><circle cx="103" cy="166" r="10"/>
      <circle cx="230" cy="105" r="6"/><circle cx="230" cy="192" r="6"/><circle cx="74" cy="188" r="6"/><circle cx="73" cy="100" r="6"/>
    </g>
