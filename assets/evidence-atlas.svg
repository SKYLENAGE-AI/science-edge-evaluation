    <path d="M340 194L350 193 359 195 366 191 374 193C379 193 379 165 384 165S388 192 395 193L406 191C412 192 413 83 420 83S426 192 434 193L447 191C452 191 453 146 459 146S465 193 472 192L482 194C488 193 489 112 496 112S502 191 510 192L522 193C529 193 528 175 534 175S540 193 547 192L558 194 568 192 575 193" stroke="#2965D8" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M420 78V200M496 106V200" stroke="#7DA4DF" stroke-dasharray="3 4" stroke-width=".8"/>
    <g fill="#FFF" stroke="#2965D8" stroke-width="1.5"><circle cx="420" cy="83" r="3"/><circle cx="496" cy="112" r="3"/></g>
    <g fill="#2965D8" font-family="monospace" font-size="9"><text x="429" y="85">α</text><text x="505" y="114">β</text></g>
    <text x="20" y="270" fill="#2563EB" font-size="10" font-weight="600">c</text>
    <text x="39" y="270" fill="#173A67" font-size="10" font-weight="600" letter-spacing="1">THE LIMIT OF INFERENCE</text>
