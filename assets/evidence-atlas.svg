<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" fill="none">
  <title>From observation to supported inference</title>
  <desc>Conceptual scientific illustration. Molecular geometry and spectral peaks are schematic, not measured experimental data.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" stroke="#DCE6F2" stroke-width=".6"/></pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#CDD8E7" stroke-width="1"/></pattern>
    <radialGradient id="halo"><stop stop-color="#D6E6FF" stop-opacity=".8"/><stop offset="1" stop-color="#F8FBFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="atom" cx=".3" cy=".2" r=".8"><stop stop-color="#FFF"/><stop offset=".38" stop-color="#E7EFF9"/><stop offset="1" stop-color="#7B98BE"/></radialGradient>
    <radialGradient id="blue" cx=".3" cy=".2" r=".8"><stop stop-color="#9CC8FF"/><stop offset=".4" stop-color="#3979EC"/><stop offset="1" stop-color="#17469C"/></radialGradient>
    <linearGradient id="area" x1="0" y1="80" x2="0" y2="207" gradientUnits="userSpaceOnUse"><stop stop-color="#3677EE" stop-opacity=".25"/><stop offset="1" stop-color="#3677EE" stop-opacity=".02"/></linearGradient>
    <linearGradient id="fade"><stop stop-color="#EAF2FF"/><stop offset="1" stop-color="#F7FAFF"/></linearGradient>
  </defs>
  <rect x=".5" y=".5" width="599" height="369" rx="10" fill="#F9FBFE" stroke="#E0E8F2"/>
