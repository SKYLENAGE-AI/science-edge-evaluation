      <text x="313" y="26" fill="#2563EB">b</text><text x="332" y="26">OBSERVED SIGNAL</text>
    </g>
    <ellipse cx="151" cy="144" rx="124" ry="98" fill="url(#halo)"/>
    <g stroke="#B7CBE4" stroke-width=".8">
